<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="1024" height="1024" role="img" aria-label="ReviewSail">
  <title>ReviewSail mark</title>
  <!--
    Icon-only mark on a transparent ground.

    No container and no stroke. In icon.svg the gap between the sails is cut
    with a dark stroke the colour of the container behind it; here the gap is
    real transparency, so the mark can sit on any background. The two sail
    paths never overlap, which is what makes that possible without a mask.
  -->
  <defs>
    <linearGradient id="rsm-front" x1=".05" y1="0" x2=".95" y2="1">
      <stop offset="0" stop-color="#6FC0F5"/>
      <stop offset="1" stop-color="#0071C2"/>
    </linearGradient>
    <linearGradient id="rsm-back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D80CC"/>
      <stop offset="1" stop-color="#00429E"/>
    </linearGradient>
  </defs>

  <path d="M23.5 16.5 L28 51.5 L9.5 48.5 C12 37 17.5 25.5 23.5 16.5 Z" fill="url(#rsm-back)"/>
  <path d="M35.8 9.5 C49 22.5 56.5 37 54 49.5 L30.5 52 Z" fill="url(#rsm-front)"/>
</svg>
