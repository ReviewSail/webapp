<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 268 64" width="268" height="64" role="img" aria-label="ReviewSail">
  <title>ReviewSail</title>
  <!--
    Combination logo — marketing site, email signatures, decks.
    NOT used anywhere inside the app: the app pairs the icon-only mark with
    live text so the wordmark stays crisp and follows the theme.

    The wordmark is set in live <text>, so it needs Inter available. For print
    or third-party handoff, outline it first — otherwise it will fall back to
    the system UI font and the spacing will shift.

    The word colour is currentColor, so this can be dropped on light or dark by
    setting `color` on the parent (or fill on the <svg>).
  -->
  <defs>
    <linearGradient id="lk-container" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#14294A"/>
      <stop offset=".5"  stop-color="#0A1728"/>
      <stop offset="1"   stop-color="#050C17"/>
    </linearGradient>
    <linearGradient id="lk-front" x1=".05" y1="0" x2=".95" y2="1">
      <stop offset="0" stop-color="#6FC0F5"/>
      <stop offset="1" stop-color="#0071C2"/>
    </linearGradient>
    <linearGradient id="lk-back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D80CC"/>
      <stop offset="1" stop-color="#00429E"/>
    </linearGradient>
  </defs>

  <g>
    <rect width="64" height="64" rx="14.5" fill="url(#lk-container)"/>
    <path d="M23.5 16.5 L28 51.5 L9.5 48.5 C12 37 17.5 25.5 23.5 16.5 Z" fill="url(#lk-back)"/>
    <path d="M35.8 9.5 C49 22.5 56.5 37 54 49.5 L30.5 52 Z"
          fill="url(#lk-front)" stroke="#0A1728" stroke-width="3.2" paint-order="stroke"/>
  </g>

  <text x="80" y="42"
        font-family="'Inter Variable', Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="30" font-weight="600" letter-spacing="-0.6"
        fill="currentColor">ReviewSail</text>
</svg>
