<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512" role="img" aria-label="ReviewSail">
  <title>ReviewSail</title>
  <!--
    ReviewSail app mark.

    Two sail planes and the diagonal gap between them — the hull is gone, which
    is what stops it reading as a boat. The foot of each sail is angled rather
    than level so nothing sits on a waterline.

    Colours sit in the upper half of the brand ramp on purpose: the brand's deep
    navy (#003B95) is nearly invisible against a dark container, so the gradient
    runs from the action blue upward rather than down into the navy.
  -->
  <defs>
    <linearGradient id="rs-container" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#14294A"/>
      <stop offset=".5"  stop-color="#0A1728"/>
      <stop offset="1"   stop-color="#050C17"/>
    </linearGradient>
    <linearGradient id="rs-front" x1=".05" y1="0" x2=".95" y2="1">
      <stop offset="0" stop-color="#6FC0F5"/>
      <stop offset="1" stop-color="#0071C2"/>
    </linearGradient>
    <linearGradient id="rs-back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D80CC"/>
      <stop offset="1" stop-color="#00429E"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14.5" fill="url(#rs-container)"/>
  <path d="M23.5 16.5 L28 51.5 L9.5 48.5 C12 37 17.5 25.5 23.5 16.5 Z" fill="url(#rs-back)"/>
  <path d="M35.8 9.5 C49 22.5 56.5 37 54 49.5 L30.5 52 Z"
        fill="url(#rs-front)" stroke="#0A1728" stroke-width="3.2" paint-order="stroke"/>
</svg>
