<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- favicon.svg is a separate, flatter drawing of the same mark — the full
         icon's gradient muds at 16px. See public/favicon.svg. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0A1728" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReviewSail</title>
    <!--
      Resolve the theme before first paint. A React effect runs after the
      browser has already painted, which shows a white flash on the way into
      dark mode. Kept deliberately tiny and in sync with applyTheme() in
      src/context/ThemeContext.tsx.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('reviewsail:theme') || 'system';
          var dark =
            stored === 'dark' ||
            (stored === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
